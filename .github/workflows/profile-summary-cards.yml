name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false

      - name: Generate complete language list
        run: python3 .github/scripts/update_languages.py
        env:
          SUMMARY_CARDS_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Commit profile cards and languages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile-summary-card-output
          if git diff --cached --quiet; then
            echo "No profile changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile cards and languages"
          git push origin "HEAD:${GITHUB_REF_NAME}"
